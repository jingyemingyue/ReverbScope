name: 缺陷报告（简体中文）
description: ReverbScope 崩溃、显示错误，或做了不该做的事。
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你抽时间报告。如果是某个**测量数值**看起来不对，请改用
        *测量问题* 模板。声卡与 DAW 的测试结果各有专门的模板。
        使用说明见[简体中文用户指南](https://github.com/jingyemingyue/ReverbScope/blob/main/docs/user-guide/zh-CN.md)。
  - type: input
    id: version
    attributes:
      label: ReverbScope 版本
      description: 环境报告的前两行（版本号和构建号）。
      placeholder: "0.4.1, build 1a2b3c4"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: ReverbScope 的安装方式
      options:
        - 桌面版，Windows 安装程序（ReverbScope-Desktop-Windows-x64-Setup.exe）
        - 桌面版，Windows zip 压缩包
        - 桌面版，macOS 磁盘映像（.dmg）
        - 桌面版，Linux 压缩包（.tar.gz）
        - 终端版（ReverbScope-Terminal-…）
        - pip / 源码检出
        - 其他
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: "macOS 15.5 (Apple silicon) / Windows 11 24H2 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 界面操作步骤或命令。最好使用合成输入（演示模式、`fake` 后端）复现。
      placeholder: |
        1. 打开独立模式
        2. 选择 ... 作为输入
        3. 点击“开始测量”
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际发生了什么
      description: ReverbScope 显示的消息，尽量逐字照录。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境报告
      description: |
        在应用中：**帮助 → 用于问题报告的环境报告 → 复制**
        （问题涉及音频设备时，请先点击 *探测采样率*）。在终端中：
        `reverbscope doctor`（设备问题请加 `--probe`）。发布前请检查内容：
        设备名称可能包含个人姓名。
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或 traceback（可选）
      description: |
        日志文件是环境报告所列数据文件夹中的 `reverbscope.log`
        （环境报告 → 打开数据文件夹）。请粘贴出错位置前后的几行。
        如果某个会话表现异常，欢迎附上会话打包文件（`reverbscope session bundle
        <session> --out report.zip`）。
      render: text
