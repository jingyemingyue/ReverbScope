name: Bug report (English)
description: ReverbScope crashes, shows an error, or does something it should not.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. If a **measurement number** looks wrong, use
        the *Measurement problem* template instead. Sound-card and DAW test
        results have their own templates.
  - type: input
    id: version
    attributes:
      label: ReverbScope version
      description: The first two lines of the environment report (version and build).
      placeholder: "0.4.1, build 1a2b3c4"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How ReverbScope was installed
      options:
        - Desktop Edition, Windows installer (ReverbScope-Desktop-Windows-x64-Setup.exe)
        - Desktop Edition, Windows zip
        - Desktop Edition, macOS disk image (.dmg)
        - Desktop Edition, Linux archive (.tar.gz)
        - Terminal Edition (ReverbScope-Terminal-…)
        - pip / source checkout
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.5 (Apple silicon) / Windows 11 24H2 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: GUI steps or commands. Synthetic inputs (Demo mode, the fake backend) are ideal.
      placeholder: |
        1. Open Standalone Mode
        2. Choose ... as the input
        3. Press Measure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: The message ReverbScope showed, word for word if you can.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment report
      description: |
        In the app: **Help → Environment Report for Bug Reports → Copy**
        (press *Probe sample rates* first when the problem involves an audio
        device). From a terminal: `reverbscope doctor` (add `--probe` for device
        problems). Review it before posting: device names can contain personal
        names.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log or traceback (optional)
      description: |
        The log file is `reverbscope.log` in the data folder the report names
        (Environment Report → Open Data Folder). Paste the lines around the
        error. A session bundle (`reverbscope session bundle <session> --out
        report.zip`) is welcome when a session misbehaves.
      render: text
