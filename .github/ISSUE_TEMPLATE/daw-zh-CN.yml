name: DAW 兼容性报告（简体中文）
description: 你以通用 DAW 模式通过某个 DAW 完成了测量。无论成功还是失败，都有帮助。
title: "[daw] <DAW 及版本> / <操作系统>"
labels: ["daw-report"]
body:
  - type: markdown
    attributes:
      value: |
        [docs/user-guide/daw-setup.zh-CN.md](https://github.com/jingyemingyue/ReverbScope/blob/main/docs/user-guide/daw-setup.zh-CN.md)
        中的 DAW 步骤依据各厂商的手册编写，目前还没有任何一步在 DAW 中实际确认过。
        你的运行就是这份确认，或是一处更正。
        如果指南中的某个菜单名称或步骤与你的版本不符，请指出是哪一处。
  - type: input
    id: daw
    attributes:
      label: DAW 及版本
      placeholder: "REAPER 7.42 / Ableton Live 12.2 / Logic Pro 11.2"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统和 ReverbScope 版本
      placeholder: "macOS 15.5 (Apple silicon), ReverbScope 0.4.1 build 1a2b3c4"
    validations:
      required: true
  - type: input
    id: interface
    attributes:
      label: 音频接口和驱动
      description: DAW 用来播放和录制的音频接口。
      placeholder: "RME Babyface Pro FS, USB, driver 1.246 (Core Audio)"
    validations:
      required: true
  - type: input
    id: rates
    attributes:
      label: 工程采样率和扫频采样率
      placeholder: "工程 48 kHz，扫频按 48 kHz 生成"
    validations:
      required: true
  - type: input
    id: export
    attributes:
      label: 录音的导出格式
      placeholder: "WAV，24 位 PCM，单声道，不标准化，不加抖动，导出整段录音"
    validations:
      required: true
  - type: dropdown
    id: stretch
    attributes:
      label: 扫频片段上的时间伸缩 / Warp / 跟随速度
      options:
        - 关闭（已在 DAW 中确认）
        - 开启（有意进行的反向测试）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 结果
      description: |
        ReverbScope 是否分析了这段录音？请从**完整报告**选项卡（或
        `reverbscope show <session>`）中粘贴以“脉冲响应：”开头的那一行
        （英文界面为 "Impulse response:"；其中给出直达声置信度，矩阵单元格
        要求为“高”（high）），以及任何关于采样率或播放速度的发现。
        如果是反向测试（44.1 kHz 工程配 48 kHz 扫频，或开启了时间伸缩），
        请说明 ReverbScope 是否报告了该问题。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境报告
      description: |
        **帮助 → 用于问题报告的环境报告 → 复制**，或在终端中运行 `reverbscope doctor`。
        其中包含 ReverbScope 版本、构建提交和操作系统。
        发布前请检查内容：设备名称可能包含个人姓名。
      render: text
    validations:
      required: true
  - type: textarea
    id: guide
    attributes:
      label: 对 DAW 指南的更正（可选）
      description: 你的版本中不同的菜单名称、默认设置或步骤。
  - type: textarea
    id: files
    attributes:
      label: 会话打包文件（可选）
      description: |
        `reverbscope session bundle <session> --out report.zip`（`--no-audio`
        可不含录音）。扫频附带的 JSON 文件和导出的录音是最有用的文件。
