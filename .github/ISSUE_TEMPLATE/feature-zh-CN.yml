name: 功能请求（简体中文）
description: 对测量、CLI、图形界面或文档的改动建议。
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ReverbScope 把**正确性放在功能之前**。凡是要凭空给出“房间评分”、
        对房间自动做 EQ，或复制其他项目源代码的请求，都会被拒绝。
        哪些内容被刻意排除在范围之外，见
        [docs/STATUS.md](https://github.com/jingyemingyue/ReverbScope/blob/main/docs/STATUS.md)（英文）。
  - type: textarea
    id: problem
    attributes:
      label: 这解决了录音工程师的什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议
      description: 应当改变什么。如果是新指标，请写明所用的算法或标准。
    validations:
      required: true
  - type: textarea
    id: validity
    attributes:
      label: 有效性
      description: 在什么情况下，新数值应当被拒绝给出，而不是靠猜测给出？
