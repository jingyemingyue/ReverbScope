name: Feature request (English)
description: A change to the measurement, CLI, GUI, or docs.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ReverbScope prefers **correctness over features**. Requests that would
        invent a "room score", auto-EQ a room, or copy another project's source
        will be declined. See [docs/STATUS.md](https://github.com/jingyemingyue/ReverbScope/blob/main/docs/STATUS.md)
        for what is deliberately out of scope.
  - type: textarea
    id: problem
    attributes:
      label: The recording-engineer problem this solves
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Name the algorithm or standard if this is a new metric.
    validations:
      required: true
  - type: textarea
    id: validity
    attributes:
      label: Validity
      description: When would the new number be refused rather than guessed?
