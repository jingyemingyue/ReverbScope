name: 提问或反馈（简体中文）
description: 关于使用 ReverbScope 的问题，或者不属于缺陷报告、功能请求的反馈。
title: "[feedback] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。崩溃或报错请用*缺陷报告*表单；数值看起来不对请用*测量问题*表单；
        在真实音频接口或 DAW 上的测试有专门的报告表单。从桌面应用打开
        （**帮助 → 发送反馈…**）时，下面的版本和系统两栏已经自动填好；在你点
        *Submit* 之前，没有发送任何内容。
  - type: input
    id: version
    attributes:
      label: ReverbScope 版本
      description: 帮助 → 关于 ReverbScope，或运行 `reverbscope --version`。
      placeholder: "0.5.0b4 (Python 3.12, Qt 6.11)"
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: "macOS 15.5（Apple 芯片）/ Windows 11 24H2 / Ubuntu 24.04"
  - type: dropdown
    id: topic
    attributes:
      label: 主题
      options:
        - 安装或启动 ReverbScope
        - 测量（音频接口或 DAW）
        - 看懂结果
        - 桌面应用的布局或用词
        - 命令行
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: 你的问题或反馈
      description: 你想做什么，想了解什么，或者希望改变什么。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 其他补充
      description: |
        截图，或环境报告的文本（**帮助 → 用于问题报告的环境报告 → 复制**，或运行
        `reverbscope doctor`），如果有帮助的话。发布前请检查一遍：设备名称里可能
        含有个人姓名。
