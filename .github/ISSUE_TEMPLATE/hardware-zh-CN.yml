name: 音频接口测试报告（简体中文）
description: 你用真实的声卡或音频接口运行了 ReverbScope。无论成功还是失败，都有帮助。
title: "[hardware] <音频接口> / <操作系统>"
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        维护者没有你的音频接口，所以你在自己机器上的真实运行是 ReverbScope
        对该接口的唯一证据。检查项列在
        [docs/HARDWARE_TESTS.zh-CN.md](https://github.com/jingyemingyue/ReverbScope/blob/main/docs/HARDWARE_TESTS.zh-CN.md)
        中；做多少项都可以。一项失败的检查与一项通过的检查同样有用。
        只有在物理音频接口上得到的结果才算数：演示模式、`fake` 后端、CI
        运行环境，以及没有直通真实设备的虚拟机都不算。
  - type: input
    id: interface
    attributes:
      label: 音频接口和驱动
      description: 型号、连接方式和驱动（知道的话请写版本号）。
      placeholder: "Focusrite Scarlett 2i2 (4th gen), USB, Focusrite Control 2 / ASIO driver 4.119"
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: 音频系统（主机 API）、采样率和声道
      description: 按独立模式中的选择（或 reverbscope measure 的选项）填写。列出你运行过的每个采样率。
      placeholder: "Windows WASAPI；44100、48000 和 96000 Hz；输入 1 -> 输出 1，回送输入 2；延迟为默认值"
    validations:
      required: true
  - type: input
    id: mic
    attributes:
      label: 话筒和扬声器（可选）
      placeholder: "Behringer ECM8000 接输入 1；Genelec 8020 接输出 1"
  - type: markdown
    attributes:
      value: |
        ### 检查项
        docs/HARDWARE_TESTS.zh-CN.md 矩阵中的每一行对应一个回答，只能选
        通过（Pass）、失败（Fail）或未运行（Not run）。选“未运行”没有关系；
        细节（消息、使用了哪些声道或采样率）请写在**结果**中。
  - type: dropdown
    id: enumeration
    attributes:
      label: "设备列表"
      description: '音频接口出现在独立模式 / `reverbscope devices` 中，且输入和输出声道数正确。'
      options:
        - 未运行（Not run）
        - 通过（Pass）
        - 失败（Fail）
      default: 0
    validations:
      required: true
  - type: dropdown
    id: rate_44k1
    attributes:
      label: "44.1 kHz 下的完整测量"
      description: '采样率设为 44100 Hz 的一次独立模式测量（仅做探测不算）。'
      options:
        - 未运行（Not run）
        - 通过（Pass）
        - 失败（Fail）
      default: 0
    validations:
      required: true
  - type: dropdown
    id: rate_48k
    attributes:
      label: "48 kHz 下的完整测量"
      description: '采样率设为 48000 Hz 的一次独立模式测量。'
      options:
        - 未运行（Not run）
        - 通过（Pass）
        - 失败（Fail）
      default: 0
    validations:
      required: true
  - type: dropdown
    id: rate_96k
    attributes:
      label: "96 kHz 下的完整测量"
      description: '采样率设为 96000 Hz 的一次独立模式测量（如果音频接口支持该采样率）。'
      options:
        - 未运行（Not run）
        - 通过（Pass）
        - 失败（Fail）
      default: 0
    validations:
      required: true
  - type: dropdown
    id: channels
    attributes:
      label: "第 1–2 声道以外的声道"
      description: '使用第 2 声道以上的输入或输出完成一次测量（例如输入 3 或输出 4）；请在“结果”中说明用了哪些声道。'
      options:
        - 未运行（Not run）
        - 通过（Pass）
        - 失败（Fail）
      default: 0
    validations:
      required: true
  - type: dropdown
    id: loopback
    attributes:
      label: "回送（loopback）录制"
      description: '用线缆把一路输出接回一路输入，并把该输入选为回送声道。'
      options:
        - 未运行（Not run）
        - 通过（Pass）
        - 失败（Fail）
      default: 0
    validations:
      required: true
  - type: dropdown
    id: stop
    attributes:
      label: "播放期间停止"
      description: '在扫频播放时点击“停止”。通过：声音立即停止（没有尾音，也没有持续不断的音），且不保存任何结果。'
      options:
        - 未运行（Not run）
        - 通过（Pass）
        - 失败（Fail）
      default: 0
    validations:
      required: true
  - type: dropdown
    id: xruns
    attributes:
      label: "完整测量且无缓冲区欠载/溢出"
      description: '通过：结果和 `reverbscope.log` 中都没有缓冲区问题警告，即没有“音频设备在本次测量中报告了丢失或延迟的缓冲区”，也没有英文的 "reported ... buffer problem(s) ... may contain dropouts"。日志位于数据文件夹（`~/.reverbscope/`，或 环境报告 → 打开数据文件夹）。'
      options:
        - 未运行（Not run）
        - 通过（Pass）
        - 失败（Fail）
      default: 0
    validations:
      required: true
  - type: dropdown
    id: unplug
    attributes:
      label: "测量期间拔出音频接口"
      description: '在扫频播放时拔掉 USB/Thunderbolt 线缆（请先把监听音箱音量调低）。通过：ReverbScope 报告错误且不保存结果；不会卡死或崩溃。'
      options:
        - 未运行（Not run）
        - 通过（Pass）
        - 失败（Fail）
      default: 0
    validations:
      required: true
  - type: dropdown
    id: standalone
    attributes:
      label: "完整的独立模式测量"
      description: '在房间中使用话筒和扬声器，完成一次测量，并得到可以读取的结果。'
      options:
        - 未运行（Not run）
        - 通过（Pass）
        - 失败（Fail）
      default: 0
    validations:
      required: true
  - type: dropdown
    id: daw
    attributes:
      label: "同一信号经过一个 DAW"
      description: '通过 DAW 以通用 DAW 模式使用同一音频接口（也欢迎另外提交一份附带细节的 DAW 兼容性报告）。'
      options:
        - 未运行（Not run）
        - 通过（Pass）
        - 失败（Fail）
      default: 0
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 结果
      description: |
        对每一项标为“通过”或“失败”的检查，说明哪些正常、哪些不正常，以及
        ReverbScope 显示的任何消息。请注明是否有咔嗒声、丢帧，或
        `reverbscope.log`（位于 `~/.reverbscope/`）中出现 "buffer problem(s)" 行。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 附带探测采样率的环境报告
      description: |
        **帮助 → 用于问题报告的环境报告 → 探测采样率 → 复制**，
        或在终端中运行 `reverbscope doctor --probe`。探测时不会播放任何声音。
        发布前请检查内容：设备名称可能包含个人姓名。
      render: text
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 会话打包文件或日志（可选）
      description: |
        拖入会话打包文件（`reverbscope session bundle <session> --out
        report.zip`，加 `--no-audio` 可不含录音），或粘贴
        `reverbscope.log` 中的相关行。
