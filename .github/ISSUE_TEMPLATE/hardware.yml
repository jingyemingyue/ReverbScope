name: Audio interface test report (English)
description: You ran ReverbScope with a real sound card or audio interface. Works or fails, both help.
title: "[hardware] <interface> on <OS>"
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        The maintainer does not own your interface, so a real run on your
        machine is the only evidence ReverbScope has for it. The checks are listed
        in [docs/HARDWARE_TESTS.md](https://github.com/jingyemingyue/ReverbScope/blob/main/docs/HARDWARE_TESTS.md);
        do as many as you like. A failed check is as useful as a pass.
        Only results from a physical interface count: not the Demo mode, the
        fake backend, a CI runner, or a virtual machine without a passed-through
        device.
  - type: input
    id: interface
    attributes:
      label: Audio interface and driver
      description: Model, how it is connected, and the driver (version if you know it).
      placeholder: "Focusrite Scarlett 2i2 (4th gen), USB, Focusrite Control 2 / ASIO driver 4.119"
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Host API, sample rates and channels
      description: As chosen in Standalone Mode (or the reverbscope measure options). List every rate you ran.
      placeholder: "Windows WASAPI; 44100, 48000 and 96000 Hz; input 1 -> output 1, loopback input 2; latency default"
    validations:
      required: true
  - type: input
    id: mic
    attributes:
      label: Microphone and loudspeaker (optional)
      placeholder: "Behringer ECM8000 into input 1; Genelec 8020 on output 1"
  - type: markdown
    attributes:
      value: |
        ### Checks
        One answer per row of the matrix in docs/HARDWARE_TESTS.md. "Not run" is
        fine; put details (messages, which channels or rates) in **Result**.
  - type: dropdown
    id: enumeration
    attributes:
      label: "Device list"
      description: 'The interface appears in Standalone Mode / `reverbscope devices` with the right number of input and output channels.'
      options:
        - Not run
        - Pass
        - Fail
      default: 0
    validations:
      required: true
  - type: dropdown
    id: rate_44k1
    attributes:
      label: "Full take at 44.1 kHz"
      description: 'A Standalone measurement with the sample rate set to 44100 Hz (not only the probe).'
      options:
        - Not run
        - Pass
        - Fail
      default: 0
    validations:
      required: true
  - type: dropdown
    id: rate_48k
    attributes:
      label: "Full take at 48 kHz"
      description: 'A Standalone measurement with the sample rate set to 48000 Hz.'
      options:
        - Not run
        - Pass
        - Fail
      default: 0
    validations:
      required: true
  - type: dropdown
    id: rate_96k
    attributes:
      label: "Full take at 96 kHz"
      description: 'A Standalone measurement with the sample rate set to 96000 Hz, if the interface offers it.'
      options:
        - Not run
        - Pass
        - Fail
      default: 0
    validations:
      required: true
  - type: dropdown
    id: channels
    attributes:
      label: "Channels beyond 1–2"
      description: 'A take using an input or output above channel 2 (for example input 3 or output 4); say which channels in Result.'
      options:
        - Not run
        - Pass
        - Fail
      default: 0
    validations:
      required: true
  - type: dropdown
    id: loopback
    attributes:
      label: "Loopback capture"
      description: 'One output cabled back to one input and chosen as the loopback channel.'
      options:
        - Not run
        - Pass
        - Fail
      default: 0
    validations:
      required: true
  - type: dropdown
    id: stop
    attributes:
      label: "Stop during playback"
      description: 'Stop pressed while the sweep plays. Pass: the sound stops at once (no tail or stuck tone) and no result is saved.'
      options:
        - Not run
        - Pass
        - Fail
      default: 0
    validations:
      required: true
  - type: dropdown
    id: xruns
    attributes:
      label: "Full take without a buffer under/overflow"
      description: 'Pass: no "reported ... buffer problem(s) ... may contain dropouts" warning in the result or in `reverbscope.log`. The log is in the data folder (`~/.reverbscope/`, or Environment Report → Open Data Folder).'
      options:
        - Not run
        - Pass
        - Fail
      default: 0
    validations:
      required: true
  - type: dropdown
    id: unplug
    attributes:
      label: "Interface unplugged during a take"
      description: 'Unplug the USB/Thunderbolt cable while the sweep plays (turn the monitors down first). Pass: ReverbScope reports an error and saves no result; it does not hang or crash.'
      options:
        - Not run
        - Pass
        - Fail
      default: 0
    validations:
      required: true
  - type: dropdown
    id: standalone
    attributes:
      label: "Full Standalone measurement"
      description: 'Microphone and loudspeaker in a room, a complete take with a result you could read.'
      options:
        - Not run
        - Pass
        - Fail
      default: 0
    validations:
      required: true
  - type: dropdown
    id: daw
    attributes:
      label: "Same signal through one DAW"
      description: 'The same interface used through a DAW with Universal DAW Mode (a DAW report with details is welcome too).'
      options:
        - Not run
        - Pass
        - Fail
      default: 0
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      description: |
        What worked and what did not, and any message ReverbScope showed, for
        each check you marked Pass or Fail. Mention clicks, dropouts, or a
        "buffer problem(s)" line in `reverbscope.log` (in `~/.reverbscope/`).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment report with probed sample rates
      description: |
        **Help → Environment Report for Bug Reports → Probe sample rates → Copy**,
        or `reverbscope doctor --probe` in a terminal. Nothing is played while
        probing. Review it before posting: device names can contain personal names.
      render: text
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Session bundle or log (optional)
      description: |
        Drag in a session bundle (`reverbscope session bundle <session> --out
        report.zip`, add `--no-audio` to leave the recordings out), or paste the
        relevant lines of `reverbscope.log`.
