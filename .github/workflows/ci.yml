# Continuous integration for RoomScope.
# DSP correctness is the product: a green run means the synthetic suite, the
# linters and the type checker all passed on this revision.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy
      - name: Documentation links
        run: python scripts/check_doc_links.py
      - name: Themed documentation site
        run: |
          python scripts/build_docs_site.py --out /tmp/roomscope-site
          test -f /tmp/roomscope-site/index.html
          test -f /tmp/roomscope-site/assets/theme.css
      - name: No-network imports and no shell-outs under src/
        run: python scripts/check_src_safety.py

  schemas:
    name: JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Schema tests
        run: pytest tests/unit/test_schemas.py tests/unit/test_public_api.py
      - name: roomscope schema matches shipped files
        run: |
          for name in result session comparison project sidecar; do
            python -c "from roomscope.schemas import schema_text, SCHEMA_FILES; from importlib.resources import files; import sys; data=schema_text('$name'); shipped=files('roomscope.schemas').joinpath(SCHEMA_FILES['$name']).read_text(encoding='utf-8'); sys.exit(0 if data==shipped else 1)"
            roomscope schema "$name" > /tmp/schema.out
            python -c "from roomscope.schemas import schema_text; import pathlib, sys; sys.exit(0 if pathlib.Path('/tmp/schema.out').read_text(encoding='utf-8')==schema_text('$name') else 1)"
          done

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries (PortAudio + Qt offscreen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0
      - name: Install
        run: pip install -e ".[dev,gui]"
      - name: Pytest
        shell: bash
        run: |
          extra=()
          if [ "${{ runner.os }}" = "Linux" ] && [ "${{ matrix.python-version }}" = "3.12" ]; then
            extra=(--cov=roomscope.core --cov=roomscope.models --cov-fail-under=85 --cov-report=term)
          fi
          pytest "${extra[@]}"
      - name: Standalone flow on the fake backend
        shell: bash
        run: |
          roomscope --backend fake devices
          roomscope --backend fake measure --out "$RUNNER_TEMP/standalone" \
            --duration 2 --post-silence 1.5 --level -20
      - name: Example script
        shell: bash
        run: python examples/synthetic_measurement.py "$RUNNER_TEMP/synthetic"

  package:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build
        run: |
          pip install build
          python -m build
          pip install dist/*.whl
          python -c "import roomscope; roomscope.analyze; print(roomscope.__version__)"
          roomscope --help

  bundle-gates:
    name: License bundle and GPL-module gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,gui]"
      - name: Build license bundle
        run: python scripts/build_license_bundle.py --out /tmp/THIRD_PARTY_LICENSES
      - name: Gate installed PySide6 Essentials
        run: |
          python - <<'PY'
          import PySide6, subprocess, sys
          root = next(iter(PySide6.__path__))
          raise SystemExit(subprocess.call([
              sys.executable,
              "scripts/check_bundle_contents.py",
              "--root",
              str(root),
              "--installed-essentials",
          ]))
          PY
