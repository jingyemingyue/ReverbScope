# Deploy the ReverbScope landing page (site/) to GitHub Pages.
# The site is static and committed; nothing is generated here. Enable once in
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions; until
# then the deploy job fails with "Pages is not enabled" and nothing is served.
name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # upload-pages-artifact tars the path it is given; without a checkout
      # the runner has no site/ and run #1 failed with "tar: site: Cannot open".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the site files
        run: |
          for file in site/index.html site/robots.txt site/sitemap.xml; do
            test -s "$file" || { echo "::error::$file is missing or empty"; exit 1; }
          done
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('site/sitemap.xml')"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90100687cd14c0b8c27b0d7b104d0d63bbba # v4
