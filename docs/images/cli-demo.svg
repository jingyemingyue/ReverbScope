<svg xmlns="http://www.w3.org/2000/svg" width="804" height="980" viewBox="0 0 804 980" role="img" aria-label="roomscope demo (synthetic data)">
<title>roomscope demo (synthetic data)</title>
<rect width="804" height="980" rx="8" fill="#1d1f23"/>
<rect width="804" height="30" rx="8" fill="#2b2e33"/>
<rect y="22" width="804" height="8" fill="#2b2e33"/>
<circle cx="18" cy="15" r="6" fill="#ff5f57"/>
<circle cx="38" cy="15" r="6" fill="#febc2e"/>
<circle cx="58" cy="15" r="6" fill="#28c840"/>
<text x="402.0" y="20" text-anchor="middle" fill="#9aa0a6" font-family="Helvetica, Arial, sans-serif" font-size="12">roomscope demo (synthetic data)</text>
<g font-family="DejaVu Sans Mono, Menlo, Consolas, Noto Sans Mono CJK SC, monospace" font-size="14" fill="#d7dae0">
<text x="16" y="60" xml:space="preserve"><tspan x="16.0" fill="#a8d982">$</tspan><tspan x="24.4"> </tspan><tspan x="32.8" font-weight="bold">roomscope demo</tspan></text>
<text x="16" y="78" xml:space="preserve"><tspan x="16.0" font-weight="bold">RoomScope demo</tspan></text>
<text x="16" y="96" xml:space="preserve"><tspan x="16.0" opacity="0.62">──────────────</tspan></text>
<text x="16" y="114" xml:space="preserve"></text>
<text x="16" y="132" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" font-weight="bold" fill="#e6c07b">!</tspan><tspan x="41.2"> </tspan><tspan x="49.6" font-weight="bold">Synthetic data: a simulated room, not a measurement.</tspan></text>
<text x="16" y="150" xml:space="preserve"><tspan x="16.0">    No audio device was used and nothing was played. The numbers below describe</tspan></text>
<text x="16" y="168" xml:space="preserve"><tspan x="16.0">    the simulation; every session is marked as a synthetic demo.</tspan></text>
<text x="16" y="186" xml:space="preserve"></text>
<text x="16" y="204" xml:space="preserve"><tspan x="16.0" font-weight="bold" fill="#6cc4d9">Files written</tspan></text>
<text x="16" y="222" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Test signal</tspan><tspan x="125.2">  roomscope-demo/sweep.wav</tspan></text>
<text x="16" y="240" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Position A</tspan><tspan x="116.8">   roomscope-demo/position-a</tspan></text>
<text x="16" y="258" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Position B</tspan><tspan x="116.8">   roomscope-demo/position-b</tspan></text>
<text x="16" y="276" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Comparison</tspan><tspan x="116.8">   roomscope-demo/comparison.json</tspan></text>
<text x="16" y="294" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">5 s sweep · 20 Hz – 20 kHz · 48 kHz</tspan></text>
<text x="16" y="312" xml:space="preserve"></text>
<text x="16" y="330" xml:space="preserve"><tspan x="16.0" font-weight="bold" fill="#6cc4d9">Position A</tspan><tspan x="100.0">  </tspan><tspan x="116.8" opacity="0.62">close to the desk and the side wall</tspan></text>
<text x="16" y="348" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Reverberation</tspan><tspan x="142.0">       </tspan><tspan x="200.8" font-weight="bold" fill="#e6c07b">!</tspan><tspan x="209.2"> RT60 0.70 s</tspan><tspan x="310.0" opacity="0.62"> (T30)</tspan><tspan x="360.4"> · EDT 0.45 s</tspan></text>
<text x="16" y="366" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Early reflections</tspan><tspan x="175.6">   </tspan><tspan x="200.8" font-weight="bold" fill="#e6c07b">!</tspan><tspan x="209.2"> strongest -3.1 dB at 2.4 ms · 2 above -20 dB</tspan></text>
<text x="16" y="384" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Low end</tspan><tspan x="91.6">             </tspan><tspan x="200.8" font-weight="bold" fill="#e6c07b">!</tspan><tspan x="209.2"> potential resonances at 110 Hz (+11.3 dB)</tspan></text>
<text x="16" y="402" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Noise floor</tspan><tspan x="125.2">         </tspan><tspan x="200.8" font-weight="bold" fill="#e6c07b">!</tspan><tspan x="209.2"> -69.2 dBFS RMS · mains hum at 50 Hz</tspan></text>
<text x="16" y="420" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Data quality</tspan><tspan x="133.6">        </tspan><tspan x="200.8" fill="#a8d982">✓</tspan><tspan x="209.2"> direct sound: confidence high · no warnings</tspan></text>
<text x="16" y="438" xml:space="preserve"></text>
<text x="16" y="456" xml:space="preserve"><tspan x="16.0" font-weight="bold" fill="#6cc4d9">Position B</tspan><tspan x="100.0">  </tspan><tspan x="116.8" opacity="0.62">moved 1 m back from the desk</tspan></text>
<text x="16" y="474" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Reverberation</tspan><tspan x="142.0">       </tspan><tspan x="200.8" font-weight="bold" fill="#e6c07b">!</tspan><tspan x="209.2"> RT60 0.51 s</tspan><tspan x="310.0" opacity="0.62"> (T30)</tspan><tspan x="360.4"> · EDT 0.43 s</tspan></text>
<text x="16" y="492" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Early reflections</tspan><tspan x="175.6">   </tspan><tspan x="200.8" fill="#a8d982">✓</tspan><tspan x="209.2"> strongest -14.5 dB at 9.3 ms · 1 above -20 dB</tspan></text>
<text x="16" y="510" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Low end</tspan><tspan x="91.6">             </tspan><tspan x="200.8" font-weight="bold" fill="#e6c07b">!</tspan><tspan x="209.2"> potential resonances at 110 Hz (+10.7 dB)</tspan></text>
<text x="16" y="528" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Noise floor</tspan><tspan x="125.2">         </tspan><tspan x="200.8" font-weight="bold" fill="#e6c07b">!</tspan><tspan x="209.2"> -87.1 dBFS RMS · mains hum at 50 Hz</tspan></text>
<text x="16" y="546" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Data quality</tspan><tspan x="133.6">        </tspan><tspan x="200.8" fill="#a8d982">✓</tspan><tspan x="209.2"> direct sound: confidence high · no warnings</tspan></text>
<text x="16" y="564" xml:space="preserve"></text>
<text x="16" y="582" xml:space="preserve"><tspan x="16.0" font-weight="bold" fill="#6cc4d9">Comparison A → B</tspan></text>
<text x="16" y="600" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Reverberation</tspan><tspan x="142.0">       </tspan><tspan x="200.8" fill="#a8d982">✓</tspan><tspan x="209.2"> RT60 0.70 s → 0.51 s (-27.3 %)</tspan></text>
<text x="16" y="618" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Early reflections</tspan><tspan x="175.6">   </tspan><tspan x="200.8" fill="#a8d982">✓</tspan><tspan x="209.2"> 2 gone · 1 new · 0 at both</tspan></text>
<text x="16" y="636" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Low end</tspan><tspan x="91.6">             </tspan><tspan x="200.8" fill="#a8d982">✓</tspan><tspan x="209.2"> at both: 110 Hz</tspan></text>
<text x="16" y="654" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Noise floor</tspan><tspan x="125.2">         </tspan><tspan x="200.8" fill="#a8d982">✓</tspan><tspan x="209.2"> -69.2 → -87.1 dBFS (-17.9 dB)</tspan></text>
<text x="16" y="672" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" opacity="0.62">Frequency response</tspan><tspan x="184.0">  </tspan><tspan x="200.8" fill="#a8d982">✓</tspan><tspan x="209.2"> largest change in the 31.5 Hz octave, 7.8 dB mean |Δ|</tspan></text>
<text x="16" y="690" xml:space="preserve"></text>
<text x="16" y="708" xml:space="preserve"><tspan x="16.0" font-weight="bold" fill="#6cc4d9">What the demo shows</tspan></text>
<text x="16" y="726" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" fill="#6cc4d9">i</tspan><tspan x="41.2"> A strong desk reflection at 2.4 ms at position A is gone at position B.</tspan></text>
<text x="16" y="744" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" fill="#6cc4d9">i</tspan><tspan x="41.2"> The 110 Hz room mode stays at both positions: it belongs to the room, not</tspan></text>
<text x="16" y="762" xml:space="preserve"><tspan x="16.0">    the spot.</tspan></text>
<text x="16" y="780" xml:space="preserve"><tspan x="16.0">  </tspan><tspan x="32.8" fill="#6cc4d9">i</tspan><tspan x="41.2"> Mains hum at 50 Hz is clearly lower at position B.</tspan></text>
<text x="16" y="798" xml:space="preserve"></text>
<text x="16" y="816" xml:space="preserve"><tspan x="16.0" font-weight="bold" fill="#6cc4d9">Next steps</tspan></text>
<text x="16" y="834" xml:space="preserve"><tspan x="16.0">  1. Read the full report of one position:</tspan></text>
<text x="16" y="852" xml:space="preserve"><tspan x="16.0">     </tspan><tspan x="58.0" fill="#6cc4d9">roomscope show roomscope-demo/position-a</tspan></text>
<text x="16" y="870" xml:space="preserve"><tspan x="16.0">  2. See every delta between the two positions:</tspan></text>
<text x="16" y="888" xml:space="preserve"><tspan x="16.0">     </tspan><tspan x="58.0" fill="#6cc4d9">roomscope compare roomscope-demo/position-a roomscope-demo/position-b --same-input-gain</tspan></text>
<text x="16" y="906" xml:space="preserve"><tspan x="16.0">  3. Open the sessions in the desktop app:</tspan></text>
<text x="16" y="924" xml:space="preserve"><tspan x="16.0">     </tspan><tspan x="58.0" fill="#6cc4d9">roomscope gui</tspan></text>
<text x="16" y="942" xml:space="preserve"><tspan x="16.0">  4. Measure your own room: write the test signal for your DAW.</tspan></text>
<text x="16" y="960" xml:space="preserve"><tspan x="16.0">     </tspan><tspan x="58.0" fill="#6cc4d9">roomscope sweep --out sweep.wav</tspan></text>
</g>
</svg>
