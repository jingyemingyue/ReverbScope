[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "roomscope"
version = "0.5.0b1"
description = "An open-source, DAW-independent recording environment analyzer."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "RoomScope contributors" }]
keywords = [
  "acoustics",
  "room acoustics",
  "impulse response",
  "sine sweep",
  "reverberation",
  "RT60",
  "recording",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
# Runtime dependencies. Every entry is reviewed in docs/DEPENDENCIES.md.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "sounddevice>=0.4.6",
  # 3.10 is the first release without the _ttconv extension (DEPENDENCIES.md §6).
  "matplotlib>=3.10",
]

[project.optional-dependencies]
# Qt GUI. Depend on Essentials only (LGPL-3.0). The PySide6 meta-package also
# pulls PySide6_Addons, which ships GPL-only modules RoomScope must not import
# (QtCharts, QtGraphs, …). See docs/DEPENDENCIES.md and CONTRIBUTING.md.
gui = ["PySide6_Essentials>=6.6"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.20",
  # The build backend; listed here so the wheel build-hook test runs in CI.
  "hatchling>=1.27",
  # Reads the GitHub issue forms so the English and Chinese pairs stay in sync.
  "pyyaml>=6.0",
]
i18n-dev = ["babel>=2.15"]

[project.scripts]
roomscope = "roomscope.cli.main:main"

[project.gui-scripts]
roomscope-gui = "roomscope.ui.app:main"

[project.entry-points."roomscope.exporters"]
csv = "roomscope.io.exporters.csv:CsvExporter"

[project.urls]
Homepage = "https://github.com/jingyemingyue/RoomScope"
Repository = "https://github.com/jingyemingyue/RoomScope"
Issues = "https://github.com/jingyemingyue/RoomScope/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/roomscope"]

# JSON files are not picked up by the default Python-package walker.
# Include each schema file, not the directory: force-including
# src/roomscope/schemas would add __init__.py twice and fail the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/roomscope/schemas/result.schema.json" = "roomscope/schemas/result.schema.json"
"src/roomscope/schemas/session.schema.json" = "roomscope/schemas/session.schema.json"
"src/roomscope/schemas/comparison.schema.json" = "roomscope/schemas/comparison.schema.json"
"src/roomscope/schemas/project.schema.json" = "roomscope/schemas/project.schema.json"
"src/roomscope/schemas/sweep-sidecar.schema.json" = "roomscope/schemas/sweep-sidecar.schema.json"
"src/roomscope/locale/zh_CN/LC_MESSAGES/roomscope.po" = "roomscope/locale/zh_CN/LC_MESSAGES/roomscope.po"
"src/roomscope/locale/zh_TW/LC_MESSAGES/roomscope.po" = "roomscope/locale/zh_TW/LC_MESSAGES/roomscope.po"
"src/roomscope/locale/ja/LC_MESSAGES/roomscope.po" = "roomscope/locale/ja/LC_MESSAGES/roomscope.po"
"src/roomscope/locale/ko/LC_MESSAGES/roomscope.po" = "roomscope/locale/ko/LC_MESSAGES/roomscope.po"
"src/roomscope/locale/es/LC_MESSAGES/roomscope.po" = "roomscope/locale/es/LC_MESSAGES/roomscope.po"
"src/roomscope/locale/fr/LC_MESSAGES/roomscope.po" = "roomscope/locale/fr/LC_MESSAGES/roomscope.po"
"src/roomscope/locale/de/LC_MESSAGES/roomscope.po" = "roomscope/locale/de/LC_MESSAGES/roomscope.po"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/roomscope",
  "tests",
  "docs",
  "examples",
  "scripts",
  "packaging",
  "requirements",
  "README.md",
  "README.zh-CN.md",
  "LICENSE",
  "NOTICE",
  "CONTRIBUTING.md",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "SECURITY.md",
  "SECURITY.zh-CN.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
  "gui: tests that need PySide6 (run with QT_QPA_PLATFORM=offscreen)",
  "slow: tests that take more than a few seconds",
]
filterwarnings = [
  "error::DeprecationWarning:roomscope",
]

[tool.coverage.run]
source = ["roomscope"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "N",   # pep8-naming
  "SIM", # simplify
  "RUF", # ruff-specific
  "C4",  # comprehensions
  "PIE",
  "T20", # no stray print() in library code
  "ARG",
]
ignore = [
  "E501",   # line length is enforced by `ruff format`; long message strings are allowed
  "RUF001", # ambiguous unicode in strings (Chinese docs/messages are intentional)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"src/roomscope/cli/*" = ["T20"]
"src/roomscope/ui/results.py" = ["E402", "I001"]
"src/roomscope/ui/compare_view.py" = ["E402", "I001"]
"src/roomscope/ui/daw.py" = ["E402", "I001"]
"examples/*" = ["T20"]
"scripts/*" = ["T20"]
"packaging/*" = ["F821"]
"hatch_build.py" = ["ARG"]
"tests/*" = ["ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src/roomscope"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
# matplotlib's Qt canvas is not fully typed; the GUI results page only wraps it.
module = ["roomscope.ui.results", "roomscope.ui.compare_view"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# PySide6_Essentials ships the widgets we import but no py.typed marker.
# Subclassing those untyped Qt types is expected in roomscope.ui.
module = ["roomscope.ui.*"]
disable_error_code = ["misc", "import-untyped"]

[[tool.mypy.overrides]]
module = [
  "_cffi_backend",
  "PySide6",
  "PySide6.*",
  # Ships with PySide6_Essentials (the gui extra); the lint job installs dev only.
  "shiboken6",
  "shiboken6.*",
  "sounddevice",
  "sounddevice.*",
  "soundfile",
  "soundfile.*",
  "scipy",
  "scipy.*",
  "matplotlib",
  "matplotlib.*",
]
ignore_missing_imports = true
